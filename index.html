<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise of Rumors</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #9cc6d8; color: #fff; font-family: "Pretendard", -apple-system, sans-serif; }
  .track { height: 300vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .bg { display: none; } /* 하늘·언덕은 캔버스에서 지평선 위치에 맞춰 그림 */
  .bg svg { width: 100%; height: 100%; display: block; }
  #ground, #gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .obj { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .obj svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .obj > img { width: 100%; height: 100%; display: block; }
  .title3d { text-align: center; white-space: nowrap; font-family: "Didot", "Bodoni 72", Georgia, serif; color: #fffdf4; text-shadow: 0 6px 30px rgba(60,90,110,.35); }
  .title3d img { width: 820px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 2px 1.5px rgba(110,40,80,.22)) drop-shadow(0 12px 22px rgba(90,50,90,.14)); } /* 글자 바로 아래 옅은 그림자 + 넓게 퍼지는 그림자 */
  .title3d p { font-family: -apple-system, sans-serif; font-size: 20px; letter-spacing: .5em; margin-top: 24px; opacity: .9; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300000; display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; font-size: 13px; letter-spacing: .15em; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.2); }
  nav .logo { font-family: Georgia, serif; font-size: 22px; letter-spacing: 0; }
  nav div { display: flex; gap: 32px; align-items: center; }
  #sound { background: none; border: 0; padding: 4px; cursor: pointer; display: flex; filter: drop-shadow(0 1px 4px rgba(0,0,0,.25)); }
  #sound .on { display: none; } #sound.playing .on { display: inline; } #sound.playing .off { display: none; }
  /* 소리를 켜면 오른쪽 위에 작은 플레이어가 보임 (유튜브 공식 뮤직비디오) */
  #player { position: fixed; top: 64px; right: 40px; width: 192px; height: 108px; border-radius: 10px; overflow: hidden; z-index: 300000; box-shadow: 0 6px 20px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity .3s, transform .3s; }
  /* 모바일(세로 화면) */
  @media (max-aspect-ratio: 1/1) {
    nav { padding: 16px 18px; font-size: 10px; letter-spacing: .12em; }
    nav div { gap: 14px; }
    #player { top: 50px; right: 18px; width: 144px; height: 81px; }
    .title3d img { width: 520px; }
    .title3d p { font-size: 20px; }
  }
  #player.show { opacity: 1; pointer-events: auto; transform: none; }
  #player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .hint { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .3em; z-index: 300000; transition: opacity .3s; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .after { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #d9c69a; color: #4a3b22; text-align: center; padding: 40px; }
  .after h2 { font-family: Georgia, serif; font-size: clamp(32px, 5vw, 64px); font-weight: 400; }
  .after p { opacity: .75; max-width: 480px; line-height: 1.7; }
</style>
</head>
<body>
<nav><div><span>STORY</span><span>MAP</span></div><div><span>SHOP</span><span>CONTACT</span><button id="sound" aria-label="소리 켜기" title="소리 켜기/끄기">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><g class="on"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g><g class="off"><path d="M17 9l5 6M22 9l-5 6"/></g></svg>
</button></div></nav>
<div id="player"><div id="yt"></div></div>

<div class="track">
  <div class="stage">
    <div class="bg" id="bg"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb3cc"/><stop offset=".45" stop-color="#b9d8e2"/><stop offset="1" stop-color="#e8e6d6"/></linearGradient></defs>
      <rect width="1600" height="900" fill="url(#sky)"/>
      <g fill="#fff" opacity=".7"><ellipse cx="300" cy="150" rx="120" ry="18"/><ellipse cx="1250" cy="110" rx="160" ry="20"/><ellipse cx="900" cy="200" rx="90" ry="12"/></g>
      <!-- 모래 언덕 -->
      <path d="M-50 400 C 200 380, 350 330, 520 300 C 700 270, 900 230, 1100 250 C 1300 270, 1450 330, 1650 360 L1650 900 L-50 900Z" fill="#e4d2a6"/>
      <path d="M-50 400 C 300 360, 600 350, 900 330 C 1100 320, 1300 340, 1650 380 L1650 900 L-50 900Z" fill="#d8c393"/>
      <g fill="#8a9a4a"><ellipse cx="420" cy="345" rx="40" ry="10"/><ellipse cx="1180" cy="352" rx="55" ry="12"/><ellipse cx="760" cy="338" rx="28" ry="7"/></g>
      <rect x="-50" y="372" width="1700" height="600" fill="#d9c69a"/>
    </svg></div>

    <canvas id="ground"></canvas>
    <canvas id="gl"></canvas>
    <div class="hint" id="hint">SCROLL ↓</div>
  </div>
</div>


<script>
// ===== 설정 =====
const EYE = 230;      // 눈높이 (바닥이 눈보다 얼마나 아래 있는지)
const DEPTH = 13000; // 물건 흩뿌리는 범위
const FAR = 7000;     // 들판이 끝나는 거리 (그 뒤는 모래 언덕)
const TRAVEL = 2400;  // 스크롤 끝까지 앞으로 걸어가는 거리
const FOCUS = 900;    // 초점 거리: 이 거리의 물건은 평면↔입체 전환 때도 크기 그대로 (돌리 줌)
const P_FLAT = 9000, P_DEEP = 360; // 마우스 위=거의 평면, 아래=입체 극대화
const ORBIT = 0.5, STRAFE = 500;   // 좌우 호버: 초점을 중심으로 도는 각도(라디안) / 옆으로 이동 거리
const KZ = .5, KX = .7; // 배치 간격 압축 (작을수록 촘촘)
const layer = document.querySelector('.stage');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

// ===== 그림 (나중에 PNG로 교체 가능) =====
const ART = {
  tuft: c => `<svg viewBox="0 0 40 30"><path d="M4 30 Q8 12 6 2 M12 30 Q14 10 18 4 M20 30 Q20 14 24 0 M28 30 Q30 16 36 6 M34 30 Q34 20 38 14" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  flower: c => `<svg viewBox="0 0 20 40"><path d="M10 40 V12" stroke="#4f7a2c" stroke-width="2"/><circle cx="10" cy="10" r="7" fill="${c}"/><circle cx="10" cy="10" r="2.5" fill="#f2c94c"/></svg>`,
  bush: c => `<svg viewBox="0 0 120 70"><ellipse cx="60" cy="68" rx="58" ry="5" fill="#000" opacity=".15"/><circle cx="35" cy="42" r="26" fill="${c}"/><circle cx="70" cy="32" r="30" fill="${c}"/><circle cx="95" cy="46" r="20" fill="${c}"/><rect x="10" y="44" width="100" height="24" rx="12" fill="${c}"/></svg>`,
  yellowTree: () => `<svg viewBox="0 0 200 240"><ellipse cx="100" cy="236" rx="80" ry="7" fill="#000" opacity=".15"/><path d="M100 236 V120 M100 160 L70 120 M100 150 L135 110" stroke="#6b4a2b" stroke-width="9" fill="none"/><g fill="#e8b82c"><circle cx="70" cy="95" r="45"/><circle cx="130" cy="85" r="50"/><circle cx="100" cy="55" r="48"/><circle cx="150" cy="130" r="30"/><circle cx="50" cy="135" r="30"/></g><g fill="#f4d257" opacity=".8"><circle cx="85" cy="60" r="20"/><circle cx="140" cy="80" r="18"/></g></svg>`,
  tent: c => `<svg viewBox="0 0 220 120"><ellipse cx="110" cy="117" rx="108" ry="6" fill="#000" opacity=".15"/><path d="M8 118 Q20 10 110 6 Q200 10 212 118Z" fill="${c}"/><path d="M60 118 Q70 30 110 6 Q150 30 160 118" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M90 118 Q110 60 130 118Z" fill="#5d7f8f" opacity=".7"/></svg>`,
  teepee: () => `<svg viewBox="0 0 140 190"><ellipse cx="70" cy="187" rx="66" ry="5" fill="#000" opacity=".15"/><path d="M58 0 L70 20 L82 0" stroke="#6b4a2b" stroke-width="4" fill="none"/><path d="M70 18 L4 188 H136Z" fill="#cfe7e3"/><path d="M40 95 H100 M28 125 H112 M16 157 H124" stroke="#7fb3b5" stroke-width="5"/><path d="M58 188 L70 130 L82 188Z" fill="#4d6c72"/></svg>`,
  truck: () => `<svg viewBox="0 0 260 120"><ellipse cx="130" cy="116" rx="128" ry="6" fill="#000" opacity=".18"/><path d="M10 92 V62 H120 V30 Q122 22 132 22 H180 Q190 22 196 32 L214 60 H246 Q254 62 254 72 V92Z" fill="#b8cfdc"/><path d="M140 30 H178 L198 58 H140Z" fill="#5b7686"/><rect x="10" y="58" width="112" height="8" fill="#8fa9b8"/><rect x="6" y="88" width="252" height="8" rx="3" fill="#7b8f9a"/><g fill="#2c2c2c"><circle cx="60" cy="96" r="18"/><circle cx="205" cy="96" r="18"/></g><g fill="#999"><circle cx="60" cy="96" r="7"/><circle cx="205" cy="96" r="7"/></g></svg>`,
  stage: () => `<svg viewBox="0 0 400 420"><ellipse cx="200" cy="416" rx="200" ry="10" fill="#000" opacity=".18"/>
    <rect x="10" y="340" width="380" height="76" fill="#2f8a5a"/><rect x="0" y="330" width="400" height="16" fill="#c9965a"/>
    <rect x="20" y="70" width="70" height="262" fill="#2f8a5a"/><rect x="310" y="70" width="70" height="262" fill="#2f8a5a"/>
    <path d="M20 140 Q20 20 200 16 Q380 20 380 140 H310 Q310 80 200 76 Q90 80 90 140Z" fill="#2c6f8f"/>
    <path d="M90 330 V150 Q90 80 200 78 Q310 80 310 150 V330" fill="#9fd0d8"/>
    <path d="M90 150 Q130 220 120 330 H90Z M310 150 Q270 220 280 330 H310Z" fill="#3a8ca8"/>
    <path d="M120 300 H280 V330 H120Z" fill="#b08050"/>
    <g transform="translate(200 70)"><path d="M-46 0 A46 46 0 0 1 46 0Z" fill="#f2c13c"/><g stroke="#f2c13c" stroke-width="5">${Array.from({length:9},(_,i)=>{const a=Math.PI*(i+.5)/9;return `<line x1="${-Math.cos(a)*52}" y1="${-Math.sin(a)*52}" x2="${-Math.cos(a)*68}" y2="${-Math.sin(a)*68}"/>`}).join('')}</g></g>
    <g fill="#f3a6b5">${[[40,100],[60,180],[45,260],[350,110],[335,200],[355,280],[110,40],[290,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7"/>`).join('')}</g>
    <g fill="#e08a3c"><circle cx="20" cy="66" r="8"/><circle cx="380" cy="66" r="8"/></g></svg>`,
};

// ===== 물건 배치 =====
const items = [];
function place(html, x, z, w, h, bottom = EYE, cls = 'obj') {
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  Object.assign(d.style, { width: w + 'px', height: h + 'px' });
  d.style.zIndex = Math.round(100000 + z * KZ); // 앞뒤 순서는 고정 (매 프레임 바꾸면 끊김)
  layer.insertBefore(d, document.getElementById('hint'));
  items.push({ d, x: x * KX, z: z * KZ, w, h, bottom, shown: true });
}
// 풀·꽃은 개수가 많아서 DOM 대신 바닥 캔버스에 직접 그림 (스크롤 끊김 방지)
const GRASS = [], ICON = {};
function grass(svg, x, z, w, h) {
  if (!ICON[svg]) { const im = new Image(); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${w * 3}" height="${h * 3}" `)); ICON[svg] = im; }
  GRASS.push({ im: ICON[svg], x: x * KX, z: z * KZ, w, h });
}
// 제목 (처음 초점 위치에 있어서 평면↔입체 때 크기 유지, 걸어가면 통과)
place('<div class="title3d"><img src="img/title.webp" alt="Paradise of Rumors"><p>SCROLL TO WALK IN</p></div>', 0, -FOCUS / KZ, 1400, 440, -40, 'obj');
const titleItem = items[items.length - 1];
// 노란 관목 (이미지 6종, 가로세로 비율)
const SHRUB = [[801, 315], [900, 210], [489, 311], [824, 267], [584, 341], [900, 416]];
const img = (src, flip) => `<img src="${src}" alt=""${flip ? ' style="transform:scaleX(-1)"' : ''}>`;
const shrub = (n, x, z, w) => place(img(`img/shrub${n}.webp`, rnd() < .5), x, z, w, w * SHRUB[n - 1][1] / SHRUB[n - 1][0]);
for (let i = 0; i < 24; i++) {
  const side = rnd() < .5 ? -1 : 1;
  shrub(1 + Math.floor(rnd() * 6), side * R(700, 2600), R(-11500, -300), R(300, 440));
}
// 앞쪽 수풀: 시작 화면(눈높이 낮을 때) 건물 아랫단을 가려줌, 눈이 올라가면 화면 아래로 내려감
for (let x = -1900; x <= 1900; x += R(260, 360)) if (Math.abs(x) > 420) shrub([1, 2, 4][Math.floor(rnd() * 3)], x, -R(1000, 1500), R(220, 320)); // 무대 앞은 비워둠, 낮은 관목만
// 캠프 (무대 근처)
shrub(3, -2900, -5200, 560); // 하늘색 차 앞에 있던 관목 → 왼쪽으로
shrub(5, -2100, -7600, 620);
shrub(6, 1900, -4300, 640);
// 천막 (그림 비율 864x1001), 원뿔 텐트 (672x1005)
// 텐트 여러 종류 [그림, 가로, 세로] — 그림 비율대로
const TENT = { tent: [570, 390], tent2: [570, 370], dome1: [600, 332], dome2: [600, 348], dome3: [600, 341], teepee: [375, 409] }; // 1.5배
const SHADOWS = []; // 바닥 그림자 (땅 x, 땅 앞뒤 f, 너비, 종류)
const tent = (n, x, z, f) => { place(img(`img/${n}.webp`, f), x, z, ...TENT[n]); SHADOWS.push([x * KX, -z * KZ, TENT[n][0], 'tent']); };
// 앞(가까움) → 뒤(무대 근처)로 나눠 배치, 무대 정면은 비워둠
// 왼쪽
tent('teepee', -1700, -6200, 0); tent('tent', -2400, -6900, 0); tent('tent', -1900, -9400, 1); // 무대 바로 왼쪽 3개는 제거
// 오른쪽: 아이보리 3개(열린 tent, 닫힌 tent2) + 하늘색 열린 돔 1개
tent('tent2', 1250, -6600, 0); // 오른쪽: 닫힌 아이보리 (관목보다 한 단계 앞)
place(img('img/wood.webp'), 1600, -6100, 110, 123); // 장작: 아이보리 텐트 오른쪽 앞
place(img('img/suvfront.webp'), 420, -8700, 240, 237); SHADOWS.push([420 * KX, 8700 * KZ, 240, 'car']); // 정면 SUV: 무대 오른쪽 앞
place(img('img/scarecrow.webp'), -1250, -5700, 160, 211);
shrub(1, -1230, -5450, 260); // 허수아비 아랫부분을 살짝 가리는 관목 // 허수아비: 왼쪽 앞 들판
tent('dome2', 1150, -11800, 1); // 분홍 텐트는 무대 뒤로
// 무대 뒤

// 망원경
place(img('img/telescope.webp'), -1500, -7300, 120, 149);
place('<img src="img/truck.webp" alt="">', -900, -7000, 650, 278);
SHADOWS.push([-900 * KX, 7000 * KZ, 650, 'car']);
shrub(6, 1750, -7300, 760); // 오른쪽 아이보리 텐트 사이 큰 관목
place('<img src="img/stage.webp" alt="">', 0, -10600, 960, 971);

// ===== 카메라 계산 (바닥 캔버스와 물건이 같은 식을 씀) =====
const track = document.querySelector('.track'), hint = document.getElementById('hint'), bg = document.getElementById('bg');
const cv = document.getElementById('ground'), ctx = cv.getContext('2d');
let mx = 0, my = 0, cmx = 0, cmy = 0, p = 0, cp = 0, W = 0, H = 0;
function resize() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
resize(); addEventListener('resize', resize);
addEventListener('mousemove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
// 모바일: 손가락을 좌우로 밀면 시점이 돌아감 (위아래는 그대로 스크롤)
let tx0 = null, mx0 = 0;
addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; mx0 = mx; }, { passive: true });
addEventListener('touchmove', e => { if (tx0 === null) return; mx = Math.max(-.4, Math.min(.4, mx0 - (e.touches[0].clientX - tx0) / innerWidth * .8)); }, { passive: true });
addEventListener('touchend', () => { tx0 = null; }, { passive: true });
addEventListener('scroll', () => { p = Math.min(1, Math.max(0, scrollY / (track.offsetHeight - innerHeight))); });

let C; // 현재 카메라
// 월드 좌표(x, 앞으로 거리 f) → 눈 기준 (가로 X, 깊이 d)
function cam3(x, f) {
  const dx = x - C.strafe, dz = f - FOCUS;         // 초점 기준
  const X = dx * C.cos - dz * C.sin, Z = dx * C.sin + dz * C.cos; // 초점을 중심으로 회전
  return [X, Z + C.P];                              // 눈은 초점에서 P만큼 뒤
}
const NEAR = 24;
function proj(X, d, y) { const s = C.P / d * C.zoom; return [C.cx + X * s, C.hy + y * s, s]; }

const SKY = new Image(); SKY.src = 'img/sky.webp';
// 배경 바위산 (x: 가운데 위치 비율, w: 너비, sink: 지평선 아래로 묻는 깊이, par: 좌우 호버 시차)
const ROCKS = [
  { n: 2, x: .52, w: 900, sink: 14, par: .45 },
  { n: 3, x: .16, w: 640, sink: 16, par: .6 },
  { n: 1, x: .84, w: 820, sink: 16, par: .7 },
].map(r => Object.assign(r, { img: Object.assign(new Image(), { src: `img/rock${r.n}.webp` }) }));
// 구름 (x: 가로 위치 비율, y: 지평선 위 높이, w: 너비, par: 호버 시 움직임 정도, speed: 흐르는 속도 px/초)
const CLOUDS = [
  { n: 3, x: .12, y: 380, w: 440, par: .35, speed: 5 },
  { n: 2, x: .70, y: 230, w: 520, par: .5, speed: 8 },
  { n: 1, x: .48, y: 560, w: 270, par: .22, speed: 3 },
  { n: 4, x: .95, y: 470, w: 330, par: .3, speed: 4 },
].map(c => Object.assign(c, { img: Object.assign(new Image(), { src: `img/cloud${c.n}.webp` }) }));
function drawGround() {
  // 하늘
  const hz = C.hy, z = C.zoom, ox = -C.yaw * W * .9;
  const g = ctx.createLinearGradient(0, hz - H * 1.1, 0, hz);
  g.addColorStop(0, '#6fa7c4'); g.addColorStop(.6, '#b9d8e2'); g.addColorStop(1, '#e8e6d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); // 이미지 로딩 전 대신 보이는 하늘
  if (SKY.complete && SKY.naturalWidth) {
    // 수채화 하늘: 지평선에 아랫단을 맞추고 화면을 덮음, 좌우 호버 때 살짝 따라 움직임 (원본 가장자리 종이 여백 4%는 잘라냄)
    const cw = SKY.naturalWidth * .92, ch = SKY.naturalHeight * .92, sx = SKY.naturalWidth * .04, sy = SKY.naturalHeight * .04;
    const sc = Math.max(W * 1.2 / cw, (hz + 60) / ch), dw = cw * sc, dh = ch * sc;
    ctx.drawImage(SKY, sx, sy, cw, ch, (W - dw) / 2 + ox * .25, hz + 60 - dh, dw, dh);
  }
  // 구름: 천천히 흘러가고, 좌우 호버 때 높이(거리)에 따라 조금씩 다르게 움직임
  const now = performance.now() / 1000;
  for (const c of CLOUDS) {
    if (!c.img.complete || !c.img.naturalWidth) continue;
    const w = c.w * z, h = w * c.img.naturalHeight / c.img.naturalWidth, span = W + w * 2;
    const x = ((c.x * W + now * c.speed + ox * c.par) % span + span) % span - w;
    ctx.drawImage(c.img, x, hz - c.y * z - h, w, h);
  }
  // 모래 언덕 (지평선에 붙어서 같이 움직임)
  const dune = (amp, base, col, ph, par) => {
    ctx.beginPath(); ctx.moveTo(-50, hz + 2);
    for (let x = -50; x <= W + 50; x += 20) { const u = (x - ox * par) / W; ctx.lineTo(x, hz - base * z - amp * z * (.55 + .45 * Math.sin(u * 4.2 + ph) * Math.sin(u * 1.7 + ph * 2))); }

  dune(60, 6, '#d8c393', 2.1, 1); // 바위산 사이를 메우는 낮은 모래 언덕
  // 바위산 (먼 것부터, 지평선에 아랫단을 묻음)
  for (const r of ROCKS) {
    if (!r.img.complete || !r.img.naturalWidth) continue;
    const w = r.w * z, h = w * r.img.naturalHeight / r.img.naturalWidth;
    ctx.drawImage(r.img, r.x * W - w / 2 + ox * r.par, hz + r.sink * z - h, w, h);
  }
  ctx.fillStyle = 'rgb(200,198,124)'; ctx.fillRect(0, hz, W, H); // 지평선 아래는 먼 초원 색 (잔디 그림 평균색)
  // 잔디 그림을 바닥에 원근으로 깔기: 앞뒤 띠 × 좌우 조각마다 평면 변환으로 패턴을 붙임 (땅에 고정 → 걸으면 발밑으로 흘러옴)
  if (!MPAT && MOTTLE_IMG.complete && MOTTLE_IMG.naturalWidth) MPAT = ctx.createPattern(MOTTLE_IMG, 'repeat');
  if (!GPAT && GRASS_IMG.complete && GRASS_IMG.naturalWidth) GPAT = ctx.createPattern(GRASS_IMG, 'repeat'); // 직접 만든 이음새 없는 수채화 잔디 (tools/make_grass.py)
  if (GL.ok) return; // 바닥은 WebGL이 그림 (아래는 WebGL 안 될 때만 쓰는 예비 방식)
  let n0 = FOCUS - C.P;
  while (n0 < FAR) {
    const st = 40 + Math.max(0, n0 - (FOCUS - C.P)) * .08, n1 = n0 + st;
    const fade = Math.min(1, Math.max(0, (n0 - 2500) / 3000)); // 멀수록 옅게

}
const GRASS_IMG = new Image(); GRASS_IMG.src = 'img/grass.webp'; let GPAT = null;
const MOTTLE_IMG = new Image(); MOTTLE_IMG.src = 'img/mottle.webp'; let MPAT = null; // 넓은 얼룩 (tools/make_mottle.py)
const TILE_W = 1400, TILE_D = TILE_W * 1024 / 1536; // 잔디 그림 한 장이 땅에서 차지하는 크기
function texQuad(x0, x1, n0, n1, fade) {

  const p00 = [(pl[0] + pr[0]) / 2 - U[0] * (xc - x0) - V[0] * (nm - n0), (pl[1] + pr[1]) / 2 - U[1] * (xc - x0) - V[1] * (nm - n0)];

  setPat(GPAT, GRASS_IMG, U, V, B, TILE_W, .23, -900, 0); // 살짝 비스듬히 깔아 반복이 가로줄로 안 보이게

// 패턴 한 장(가로 tw)을 땅 위에 rot 라디안 돌리고 (ox, of) 만큼 옮겨 깔기
function setPat(pat, im, U, V, B, tw, rot, ox, of) {

  pat.setTransform(new DOMMatrix([cx[0] * a, cx[1] * a, cy[0] * b, cy[1] * b, B[0] + U[0] * ox + V[0] * of, B[1] + U[1] * ox + V[1] * of]));
}
// 바닥 사각형: 눈 앞(NEAR)으로 잘라서 그림
function quad(x0, x1, f0, f1, color) {
  let pts = [[x0, f0], [x1, f0], [x1, f1], [x0, f1]].map(([x, f]) => cam3(x, f));
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], ia = a[1] >= NEAR, ib = b[1] >= NEAR;
    if (ia) out.push(a);
    if (ia !== ib) { const t = (NEAR - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * t, NEAR]); }

  if (out.length < 3) return;
  ctx.beginPath();
  out.forEach(([X, d], i) => { const [sx, sy] = proj(X, d, C.eye); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
}

// 입체로 바뀔수록 물건 아래 바닥에 부드러운 그림자 (해는 왼쪽 앞 → 그림자는 오른쪽 뒤로 살짝)
function drawShadows() {
  const k = C.rise; if (k < .02) return;
  for (const it of items) {
    if (it === titleItem || it.bottom !== EYE) continue;
    const n = -it.z - C.walk, r = it.w * .55;
    const [Xc, dc] = cam3(it.x + r * .25, n + r * .2);
    if (dc < NEAR + 20) continue;
    const c = proj(Xc, dc, C.eye), e = proj(...cam3(it.x + r * 1.25, n + r * .2), C.eye), b = proj(...cam3(it.x + r * .25, n + r * 1.1), C.eye);
    const rx = Math.hypot(e[0] - c[0], e[1] - c[1]), ry = Math.max(rx * .1, Math.abs(c[1] - b[1]));
    if (c[0] + rx < 0 || c[0] - rx > W || c[1] > H + ry) continue;
    ctx.save(); ctx.translate(c[0], c[1]); ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, `rgba(40,60,22,${.5 * k})`); g.addColorStop(.55, `rgba(40,60,22,${.26 * k})`); g.addColorStop(1, 'rgba(48,70,28,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill(); ctx.restore();

}
function drawGrass() {
  const list = [];
  for (const g of GRASS) {
    const [X, d] = cam3(g.x, -g.z - C.walk);
    if (d < NEAR + 10) continue;
    const [sx, sy, s] = proj(X, d, C.eye);
    const w = g.w * s, h = g.h * s;
    if (sx + w < 0 || sx - w > W || sy - h > H || sy < 0 || h > H * .75) continue;
    list.push([d, g.im, sx - w / 2, sy - h, w, h]);
  }
  list.sort((a, b) => b[0] - a[0]); // 먼 것부터
  for (const [, im, x, y, w, h] of list) if (im.complete) ctx.drawImage(im, x, y, w, h);
}

// ===== WebGL 바닥: 화면 픽셀마다 땅 위치를 거꾸로 계산해 잔디를 원근 그대로 칠함 (타일 반복·사파리 속도 개선) =====
const GL = (() => {
  const c = document.getElementById('gl'), g = c.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!g) { c.style.display = 'none'; return { ok: false }; }
  const sh = (t, src) => { const o = g.createShader(t); g.shaderSource(o, src); g.compileShader(o); if (!g.getShaderParameter(o, g.COMPILE_STATUS)) console.error(g.getShaderInfoLog(o)); return o; };
  const pr = g.createProgram();
  g.attachShader(pr, sh(g.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  g.attachShader(pr, sh(g.FRAGMENT_SHADER, `

uniform vec2 uRes; uniform float uDpr;
uniform vec4 uCam;   // cx, 지평선 y, P*zoom, 눈높이
uniform vec4 uRot;   // cos, sin, 옆이동, P
uniform vec3 uWalk;  // 걸은 거리, FOCUS, FAR
uniform sampler2D uGrass, uMottle;
uniform vec4 uSh[16]; uniform int uShN;
vec2 rot(vec2 v, float a){ float c=cos(a), s=sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
void main(){
  vec2 s = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;
  float k = (s.y - uCam.y) / uCam.w; if (k <= 0.0) discard;
  float d = uCam.z / k, X = (s.x - uCam.x) / k, Z = d - uRot.w;
  float x = X * uRot.x + Z * uRot.y + uRot.z, n = -X * uRot.y + Z * uRot.x + uWalk.y;
  if (n > uWalk.z) discard;
  vec2 w = vec2(x, n + uWalk.x);                       // 땅 좌표
  vec3 g1 = texture2D(uGrass, rot(w + vec2(900., 0.), .23) / vec2(1400., -933.)).rgb;
  vec3 g2 = texture2D(uGrass, rot(w - vec2(517., -311.), -.71) / vec2(2150., -1433.)).rgb;
  vec3 m  = texture2D(uMottle, rot(w, .27) / 6000.).rgb;
  float mask = smoothstep(.38, .62, texture2D(uMottle, rot(w, 1.3) / 4300. + .37).g * 1.4 - .2);
  vec3 col = mix(g1, g2, mask);                          // 두 잔디를 큰 얼룩 모양으로 섞어 반복을 숨김
  col = mix(col, col * (m / vec3(.67, .74, .41)), .28);  // 넓은 수채 얼룩
  float sd = 0.;                                          // 텐트 밑 그림자
  // 부드러운 그림자: 넓게 번지는 반그림자 + 바닥에 닿는 곳만 조금 진하게, 회색 대신 푸른 초록빛으로 어둡게
  for (int i = 0; i < 16; i++) { if (i >= uShN) break; float r = length((w - uSh[i].xy) / uSh[i].zw); sd += .55 * (1. - smoothstep(.55, 1.35, r)) + .45 * (1. - smoothstep(.82, 1.02, r)); }
  col *= mix(vec3(1.), vec3(.70, .78, .76), .42 * min(1., sd));

  gl_FragColor = vec4(col, 1.);
}`));
  g.linkProgram(pr); g.useProgram(pr);
  const b = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, b); g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(pr, 'p'); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);

function drawGL() {

  g.uniform2f(U('uRes'), W, H); g.uniform1f(U('uDpr'), c.width / W);
  g.uniform4f(U('uCam'), C.cx, C.hy, C.P * C.zoom, C.eye);

  const sh = new Float32Array(64);
  SHADOWS.slice(0, 16).forEach(([x, f, w, t], i) => sh.set(t === 'tent' ? [x, f + w * .44, w * .52, w * .5] : [x + w * .02, f + w * .1, w * .5, w * .14], i * 4));

function render() {
  cp += (p - cp) * .07; cmx += (mx - cmx) * .07; cmy += (my - cmy) * .07;
  // 스크롤 앞부분: 땅에 붙어 있던 눈이 올라가며 바닥면이 드러남(평면 → 입체), 뒷부분: 앞으로 걸어감
  const rr = Math.min(1, cp / .35), rise = rr * rr * (3 - 2 * rr);
  const wp = Math.min(1, Math.max(0, (cp - .2) / .8));
  const ease = wp < .5 ? 2 * wp * wp : 1 - Math.pow(-2 * wp + 2, 2) / 2;
  const walk = ease * TRAVEL;
  const eye = 45 + (EYE - 45) * rise; // 시작 눈높이를 땅에서 살짝 띄워 나무·텐트가 땅에 붙어 보이게
  const t = .5;                                          // 원근 강도 고정 (앞뒤 이동은 스크롤로만)
  const P = P_FLAT * Math.pow(P_DEEP / P_FLAT, t);
  const hov = .25 + .75 * rise;                          // 스크롤 전엔 좌우 호버를 약하게
  const a = -cmx * 2 * ORBIT * hov;                       // 좌우: 초점 중심 회전
  const bob = Math.sin(walk / 70) * 3 * Math.min(1, cp * 20) * (1 - cp);
  C = { P, walk, strafe: cmx * 2 * STRAFE * hov, cos: Math.cos(a), sin: Math.sin(a), zoom: H > W ? W / 560 : Math.min(H / 900, W / 1440), cx: W / 2, hy: H * (H > W ? .74 - .2 * rise : .88 - .46 * rise) + bob, eye, yaw: a, rise };
  drawGround();
  drawGL();
  drawGrass();
  for (const it of items) {
    const [X, d] = cam3(it.x, -it.z - walk);
    let show = d > NEAR + 10;
    if (show) {
      const [sx, sy, s] = proj(X, d, eye - (EYE - it.bottom)); // 땅 높이는 눈높이에 따라
      const L = sx - it.w / 2 * s; let T = sy - it.h * s - (it === titleItem && H > W ? H * .05 : 0); // 세로 화면이면 제목을 살짝 위로
      if (it === titleItem) T += Math.max(0, 58 - T) * (1 - Math.min(1, cp / .15)); // 시작 화면에서 제목 윗부분이 화면 위로 잘리지 않게 (스크롤하면 원래대로)
      show = L < W && L + it.w * s > 0 && T < H && s < 40 && (it.h > 400 || it.h * s < H * .75); // 눈앞에서 너무 커진 풀·꽃은 숨김 (무대 같은 큰 건 제외)
      if (it === titleItem) { // 제목은 다가오며 커지면 흐려지다 사라짐 (너무 크게 키웠다가 돌아올 때 이미지가 덜 그려지는 문제 방지)
        const k = s / C.zoom, op = Math.min(1, Math.max(0, (2.8 - k) / 1));
        it.d.style.opacity = op; if (op <= 0) show = false;
      }
      if (show) {
        it.d.style.transform = `translate3d(${L}px, ${T}px, 0) scale(${s})`;
      }
    }
    if (show !== it.shown) { it.d.style.visibility = show ? '' : 'hidden'; it.shown = show; } // display:none 대신 visibility → 다시 보일 때 이미지 새로 안 불러옴
  }
  hint.style.opacity = cp > .03 ? 0 : 1;
}
function frame() { render(); requestAnimationFrame(frame); }
frame();

// ===== 소리: 악뮤 '소문의 낙원' 공식 뮤직비디오 (유튜브) — 스피커를 누르면 재생/멈춤 =====
const soundBtn = document.getElementById('sound'), playerBox = document.getElementById('player');
let yt = null, ytReady = false, wantPlay = false;
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt', { videoId: 'D54StAZFUrc', playerVars: { playsinline: 1, controls: 0, loop: 1, playlist: 'D54StAZFUrc', rel: 0, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; if (wantPlay) yt.playVideo(); } } });
};
const ytScript = document.createElement('script'); ytScript.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(ytScript);
soundBtn.addEventListener('click', () => {
  wantPlay = !wantPlay;
  soundBtn.classList.toggle('playing', wantPlay); playerBox.classList.toggle('show', wantPlay);
  soundBtn.setAttribute('aria-label', wantPlay ? '소리 끄기' : '소리 켜기');
  if (ytReady) wantPlay ? (yt.unMute(), yt.playVideo()) : yt.pauseVideo();
});
