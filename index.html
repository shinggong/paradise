<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise of Rumors</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #9cc6d8; color: #fff; font-family: "Pretendard", -apple-system, sans-serif; }
  .track { height: 300vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .bg { display: none; } /* 하늘·언덕은 캔버스에서 지평선 위치에 맞춰 그림 */
  .bg svg { width: 100%; height: 100%; display: block; }
  #ground { position: absolute; inset: 0; width: 100%; height: 100%; }
  .obj { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .obj svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .obj > img { width: 100%; height: 100%; display: block; }
  .title3d { text-align: center; white-space: nowrap; font-family: "Didot", "Bodoni 72", Georgia, serif; color: #fffdf4; text-shadow: 0 6px 30px rgba(60,90,110,.35); }
  .title3d img { width: 820px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 2px 1.5px rgba(110,40,80,.22)) drop-shadow(0 12px 22px rgba(90,50,90,.14)); } /* 글자 바로 아래 옅은 그림자 + 넓게 퍼지는 그림자 */
  .title3d p { font-family: -apple-system, sans-serif; font-size: 20px; letter-spacing: .5em; margin-top: 24px; opacity: .9; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300000; display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; font-size: 13px; letter-spacing: .15em; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.2); }
  nav .logo { font-family: Georgia, serif; font-size: 22px; letter-spacing: 0; }
  nav div { display: flex; gap: 32px; }
  .hint { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .3em; z-index: 300000; transition: opacity .3s; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .after { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #d9c69a; color: #4a3b22; text-align: center; padding: 40px; }
  .after h2 { font-family: Georgia, serif; font-size: clamp(32px, 5vw, 64px); font-weight: 400; }
  .after p { opacity: .75; max-width: 480px; line-height: 1.7; }
</style>
</head>
<body>
<nav><div><span>STORY</span><span>MAP</span></div><span class="logo">들판</span><div><span>SHOP</span><span>CONTACT</span></div></nav>

<div class="track">
  <div class="stage">
    <div class="bg" id="bg"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb3cc"/><stop offset=".45" stop-color="#b9d8e2"/><stop offset="1" stop-color="#e8e6d6"/></linearGradient></defs>
      <rect width="1600" height="900" fill="url(#sky)"/>
      <g fill="#fff" opacity=".7"><ellipse cx="300" cy="150" rx="120" ry="18"/><ellipse cx="1250" cy="110" rx="160" ry="20"/><ellipse cx="900" cy="200" rx="90" ry="12"/></g>
      <!-- 모래 언덕 -->
      <path d="M-50 400 C 200 380, 350 330, 520 300 C 700 270, 900 230, 1100 250 C 1300 270, 1450 330, 1650 360 L1650 900 L-50 900Z" fill="#e4d2a6"/>
      <path d="M-50 400 C 300 360, 600 350, 900 330 C 1100 320, 1300 340, 1650 380 L1650 900 L-50 900Z" fill="#d8c393"/>
      <g fill="#8a9a4a"><ellipse cx="420" cy="345" rx="40" ry="10"/><ellipse cx="1180" cy="352" rx="55" ry="12"/><ellipse cx="760" cy="338" rx="28" ry="7"/></g>
      <rect x="-50" y="372" width="1700" height="600" fill="#d9c69a"/>
    </svg></div>

    <canvas id="ground"></canvas>
    <div class="hint" id="hint">SCROLL ↓</div>
  </div>
</div>


<script>
// ===== 설정 =====
const EYE = 230;      // 눈높이 (바닥이 눈보다 얼마나 아래 있는지)
const DEPTH = 13000; // 물건 흩뿌리는 범위
const FAR = 7000;     // 들판이 끝나는 거리 (그 뒤는 모래 언덕)
const TRAVEL = 3800;  // 스크롤 끝까지 앞으로 걸어가는 거리
const FOCUS = 900;    // 초점 거리: 이 거리의 물건은 평면↔입체 전환 때도 크기 그대로 (돌리 줌)
const P_FLAT = 9000, P_DEEP = 360; // 마우스 위=거의 평면, 아래=입체 극대화
const ORBIT = 0.5, STRAFE = 500;   // 좌우 호버: 초점을 중심으로 도는 각도(라디안) / 옆으로 이동 거리
const KZ = .5, KX = .7; // 배치 간격 압축 (작을수록 촘촘)
const layer = document.querySelector('.stage');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

// ===== 그림 (나중에 PNG로 교체 가능) =====
const ART = {
  tuft: c => `<svg viewBox="0 0 40 30"><path d="M4 30 Q8 12 6 2 M12 30 Q14 10 18 4 M20 30 Q20 14 24 0 M28 30 Q30 16 36 6 M34 30 Q34 20 38 14" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  flower: c => `<svg viewBox="0 0 20 40"><path d="M10 40 V12" stroke="#4f7a2c" stroke-width="2"/><circle cx="10" cy="10" r="7" fill="${c}"/><circle cx="10" cy="10" r="2.5" fill="#f2c94c"/></svg>`,
  bush: c => `<svg viewBox="0 0 120 70"><ellipse cx="60" cy="68" rx="58" ry="5" fill="#000" opacity=".15"/><circle cx="35" cy="42" r="26" fill="${c}"/><circle cx="70" cy="32" r="30" fill="${c}"/><circle cx="95" cy="46" r="20" fill="${c}"/><rect x="10" y="44" width="100" height="24" rx="12" fill="${c}"/></svg>`,
  yellowTree: () => `<svg viewBox="0 0 200 240"><ellipse cx="100" cy="236" rx="80" ry="7" fill="#000" opacity=".15"/><path d="M100 236 V120 M100 160 L70 120 M100 150 L135 110" stroke="#6b4a2b" stroke-width="9" fill="none"/><g fill="#e8b82c"><circle cx="70" cy="95" r="45"/><circle cx="130" cy="85" r="50"/><circle cx="100" cy="55" r="48"/><circle cx="150" cy="130" r="30"/><circle cx="50" cy="135" r="30"/></g><g fill="#f4d257" opacity=".8"><circle cx="85" cy="60" r="20"/><circle cx="140" cy="80" r="18"/></g></svg>`,
  tent: c => `<svg viewBox="0 0 220 120"><ellipse cx="110" cy="117" rx="108" ry="6" fill="#000" opacity=".15"/><path d="M8 118 Q20 10 110 6 Q200 10 212 118Z" fill="${c}"/><path d="M60 118 Q70 30 110 6 Q150 30 160 118" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M90 118 Q110 60 130 118Z" fill="#5d7f8f" opacity=".7"/></svg>`,
  teepee: () => `<svg viewBox="0 0 140 190"><ellipse cx="70" cy="187" rx="66" ry="5" fill="#000" opacity=".15"/><path d="M58 0 L70 20 L82 0" stroke="#6b4a2b" stroke-width="4" fill="none"/><path d="M70 18 L4 188 H136Z" fill="#cfe7e3"/><path d="M40 95 H100 M28 125 H112 M16 157 H124" stroke="#7fb3b5" stroke-width="5"/><path d="M58 188 L70 130 L82 188Z" fill="#4d6c72"/></svg>`,
  truck: () => `<svg viewBox="0 0 260 120"><ellipse cx="130" cy="116" rx="128" ry="6" fill="#000" opacity=".18"/><path d="M10 92 V62 H120 V30 Q122 22 132 22 H180 Q190 22 196 32 L214 60 H246 Q254 62 254 72 V92Z" fill="#b8cfdc"/><path d="M140 30 H178 L198 58 H140Z" fill="#5b7686"/><rect x="10" y="58" width="112" height="8" fill="#8fa9b8"/><rect x="6" y="88" width="252" height="8" rx="3" fill="#7b8f9a"/><g fill="#2c2c2c"><circle cx="60" cy="96" r="18"/><circle cx="205" cy="96" r="18"/></g><g fill="#999"><circle cx="60" cy="96" r="7"/><circle cx="205" cy="96" r="7"/></g></svg>`,
  stage: () => `<svg viewBox="0 0 400 420"><ellipse cx="200" cy="416" rx="200" ry="10" fill="#000" opacity=".18"/>
    <rect x="10" y="340" width="380" height="76" fill="#2f8a5a"/><rect x="0" y="330" width="400" height="16" fill="#c9965a"/>
    <rect x="20" y="70" width="70" height="262" fill="#2f8a5a"/><rect x="310" y="70" width="70" height="262" fill="#2f8a5a"/>
    <path d="M20 140 Q20 20 200 16 Q380 20 380 140 H310 Q310 80 200 76 Q90 80 90 140Z" fill="#2c6f8f"/>
    <path d="M90 330 V150 Q90 80 200 78 Q310 80 310 150 V330" fill="#9fd0d8"/>
    <path d="M90 150 Q130 220 120 330 H90Z M310 150 Q270 220 280 330 H310Z" fill="#3a8ca8"/>
    <path d="M120 300 H280 V330 H120Z" fill="#b08050"/>
    <g transform="translate(200 70)"><path d="M-46 0 A46 46 0 0 1 46 0Z" fill="#f2c13c"/><g stroke="#f2c13c" stroke-width="5">${Array.from({length:9},(_,i)=>{const a=Math.PI*(i+.5)/9;return `<line x1="${-Math.cos(a)*52}" y1="${-Math.sin(a)*52}" x2="${-Math.cos(a)*68}" y2="${-Math.sin(a)*68}"/>`}).join('')}</g></g>
    <g fill="#f3a6b5">${[[40,100],[60,180],[45,260],[350,110],[335,200],[355,280],[110,40],[290,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7"/>`).join('')}</g>
    <g fill="#e08a3c"><circle cx="20" cy="66" r="8"/><circle cx="380" cy="66" r="8"/></g></svg>`,
};

// ===== 물건 배치 =====
const items = [];
function place(html, x, z, w, h, bottom = EYE, cls = 'obj') {
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  Object.assign(d.style, { width: w + 'px', height: h + 'px' });
  layer.insertBefore(d, document.getElementById('hint'));
  items.push({ d, x: x * KX, z: z * KZ, w, h, bottom, shown: true });
}
// 제목 (처음 초점 위치에 있어서 평면↔입체 때 크기 유지, 걸어가면 통과)
place('<div class="title3d"><img src="img/title.webp" alt="Paradise of Rumors"><p>SCROLL TO WALK IN</p></div>', 0, -FOCUS / KZ, 1400, 440, -40, 'obj');
const titleItem = items[items.length - 1];
// 잔디·꽃: 아래쪽 입체감의 핵심 (발밑으로 쏟아져 들어옴)
for (let i = 0; i < 560; i++) {
  const z = R(-DEPTH + 1500, 9000), x = R(-2600, 2600);
  const s = R(.8, 1.6);
  place(ART.tuft(pick(['#4e7d2a', '#5f8f33', '#86b04f', '#3f6b22'])), x, z, 40 * s, 30 * s);
}
for (let i = 0; i < 200; i++) {
  const z = R(-DEPTH + 2000, 9000), x = R(-2400, 2400);
  place(ART.flower(pick(['#ffffff', '#fff4c2', '#f6b6c8', '#c9e6ff'])), x, z, 20, 40);
}
for (let i = 0; i < 30; i++) {
  const side = rnd() < .5 ? -1 : 1;
  place(ART.bush(pick(['#6d8b3a', '#7f9c45', '#5c7a32'])), side * R(700, 2600), R(-11500, -300), 200, 116);
}
// 캠프 (무대 근처)
place(ART.yellowTree(), -1500, -5200, 520, 620);
place(ART.yellowTree(), -2100, -7600, 560, 670);
place(ART.yellowTree(), 1900, -4300, 460, 550);
[[-1100, -8200, '#eef4f4'], [-1700, -9000, '#d9ecf0'], [1300, -8600, '#f3f0ea'], [2000, -9400, '#e2eef0'], [-700, -9700, '#f0ece2'], [900, -9900, '#dcecef']].forEach(([x, z, c]) => place(ART.tent(c), x, z, 420, 230));
place(ART.teepee(), 1500, -7600, 260, 350);
place(ART.teepee(), -2400, -10400, 240, 325);
place(ART.truck(), -900, -7000, 460, 212);
place('<img src="img/stage.webp" alt="">', 0, -10600, 960, 971);

// ===== 카메라 계산 (바닥 캔버스와 물건이 같은 식을 씀) =====
const track = document.querySelector('.track'), hint = document.getElementById('hint'), bg = document.getElementById('bg');
const cv = document.getElementById('ground'), ctx = cv.getContext('2d');
let mx = 0, my = 0, cmx = 0, cmy = 0, p = 0, cp = 0, W = 0, H = 0;
function resize() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
resize(); addEventListener('resize', resize);
addEventListener('mousemove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
addEventListener('scroll', () => { p = Math.min(1, Math.max(0, scrollY / (track.offsetHeight - innerHeight))); });

let C; // 현재 카메라
// 월드 좌표(x, 앞으로 거리 f) → 눈 기준 (가로 X, 깊이 d)
function cam3(x, f) {
  const dx = x - C.strafe, dz = f - FOCUS;         // 초점 기준
  const X = dx * C.cos - dz * C.sin, Z = dx * C.sin + dz * C.cos; // 초점을 중심으로 회전
  return [X, Z + C.P];                              // 눈은 초점에서 P만큼 뒤
}
const NEAR = 24;
function proj(X, d, y) { const s = C.P / d * C.zoom; return [C.cx + X * s, C.hy + y * s, s]; }

const SKY = new Image(); SKY.src = 'img/sky.webp';
function drawGround() {
  // 하늘
  const hz = C.hy, z = C.zoom, ox = -C.yaw * W * .9;
  const g = ctx.createLinearGradient(0, hz - H * 1.1, 0, hz);
  g.addColorStop(0, '#6fa7c4'); g.addColorStop(.6, '#b9d8e2'); g.addColorStop(1, '#e8e6d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); // 이미지 로딩 전 대신 보이는 하늘
  if (SKY.complete && SKY.naturalWidth) {
    // 수채화 하늘: 지평선에 아랫단을 맞추고 화면을 덮음, 좌우 호버 때 살짝 따라 움직임 (원본 가장자리 종이 여백 4%는 잘라냄)
    const cw = SKY.naturalWidth * .92, ch = SKY.naturalHeight * .92, sx = SKY.naturalWidth * .04, sy = SKY.naturalHeight * .04;
    const sc = Math.max(W * 1.2 / cw, (hz + 60) / ch), dw = cw * sc, dh = ch * sc;
    ctx.drawImage(SKY, sx, sy, cw, ch, (W - dw) / 2 + ox * .25, hz + 60 - dh, dw, dh);
  }
  // 모래 언덕 (지평선에 붙어서 같이 움직임)
  const dune = (amp, base, col, ph, par) => {
    ctx.beginPath(); ctx.moveTo(-50, hz + 2);
    for (let x = -50; x <= W + 50; x += 20) { const u = (x - ox * par) / W; ctx.lineTo(x, hz - base * z - amp * z * (.55 + .45 * Math.sin(u * 4.2 + ph) * Math.sin(u * 1.7 + ph * 2))); }
    ctx.lineTo(W + 50, hz + 2); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  dune(170, 50, '#e4d2a6', .4, .6); dune(90, 14, '#d8c393', 2.1, 1);
  ctx.fillStyle = '#d9c69a'; ctx.fillRect(0, hz, W, 40 * z);
  ctx.fillStyle = '#6a9439'; ctx.fillRect(0, hz + 40 * z * (1 - C.rise), W, H); // 처음엔 바닥이 옆에서 본 것처럼 얇은 띠
  const step = 60, base = Math.floor((C.walk + FOCUS - C.P) / step) * step; // 줄무늬는 땅에 고정 → 걸으면 발밑으로 흘러옴
  const sand = [217, 198, 154];
  for (let f0 = base; f0 < C.walk + FAR; f0 += step) {
    const n0 = f0 - C.walk, n1 = n0 + step; // 걷는 사람 기준 앞쪽 거리
    const k = Math.round(f0 / step) & 1;
    const fade = Math.min(1, Math.max(0, (n0 - 2200) / 3200));
    const g = k ? [111, 155, 61] : [124, 170, 71];
    const col = g.map((v, i) => Math.round(v + (sand[i] - v) * fade));
    quad(-20000, 20000, n0, n1, `rgb(${col})`);
  }
}
// 바닥 사각형: 눈 앞(NEAR)으로 잘라서 그림
function quad(x0, x1, f0, f1, color) {
  let pts = [[x0, f0], [x1, f0], [x1, f1], [x0, f1]].map(([x, f]) => cam3(x, f));
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], ia = a[1] >= NEAR, ib = b[1] >= NEAR;
    if (ia) out.push(a);
    if (ia !== ib) { const t = (NEAR - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * t, NEAR]); }
  }
  if (out.length < 3) return;
  ctx.beginPath();
  out.forEach(([X, d], i) => { const [sx, sy] = proj(X, d, C.eye); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
}

function render() {
  cp += (p - cp) * .07; cmx += (mx - cmx) * .07; cmy += (my - cmy) * .07;
  // 스크롤 앞부분: 땅에 붙어 있던 눈이 올라가며 바닥면이 드러남(평면 → 입체), 뒷부분: 앞으로 걸어감
  const rr = Math.min(1, cp / .35), rise = rr * rr * (3 - 2 * rr);
  const wp = Math.min(1, Math.max(0, (cp - .2) / .8));
  const ease = wp < .5 ? 2 * wp * wp : 1 - Math.pow(-2 * wp + 2, 2) / 2;
  const walk = ease * TRAVEL;
  const eye = 4 + (EYE - 4) * rise;
  const t = .5;                                          // 원근 강도 고정 (앞뒤 이동은 스크롤로만)
  const P = P_FLAT * Math.pow(P_DEEP / P_FLAT, t);
  const a = -cmx * 2 * ORBIT;                             // 좌우: 초점 중심 회전
  const bob = Math.sin(walk / 70) * 3 * Math.min(1, cp * 20) * (1 - cp);
  C = { P, walk, strafe: cmx * 2 * STRAFE, cos: Math.cos(a), sin: Math.sin(a), zoom: Math.min(H / 900, W / 1440), cx: W / 2, hy: H * (.88 - .46 * rise) + bob, eye, yaw: a, rise };
  drawGround();
  for (const it of items) {
    const [X, d] = cam3(it.x, -it.z - walk);
    let show = d > NEAR + 10;
    if (show) {
      const [sx, sy, s] = proj(X, d, eye - (EYE - it.bottom)); // 땅 높이는 눈높이에 따라
      const L = sx - it.w / 2 * s, T = sy - it.h * s - (it === titleItem && H > W ? H * .1 : 0); // 세로 화면이면 제목을 살짝 위로
      show = L < W && L + it.w * s > 0 && T < H && s < 40 && it.h * s < H * .75; // 눈앞에서 너무 커진 건 숨김
      if (show) { it.d.style.transform = `translate3d(${L}px, ${T}px, 0) scale(${s})`; it.d.style.zIndex = Math.round(100000 - d); }
    }
    if (show !== it.shown) { it.d.style.display = show ? '' : 'none'; it.shown = show; }
  }
  hint.style.opacity = cp > .03 ? 0 : 1;
}
function frame() { render(); requestAnimationFrame(frame); }
frame();
</script>
</body>
</html>
