<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #9cc6d8; color: #fff; font-family: "Pretendard", -apple-system, sans-serif; overscroll-behavior: none; }
  .stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #sky, #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .obj { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  .obj svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .title3d { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; font-family: "Didot", "Bodoni 72", Georgia, serif; color: #fffdf4; font-size: 930px; line-height: .8; letter-spacing: -.03em; white-space: nowrap; text-shadow: 0 10px 50px rgba(60,90,110,.25); }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300000; display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; font-size: 13px; letter-spacing: .15em; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.2); }
  nav .logo { font-family: Georgia, serif; font-size: 22px; letter-spacing: 0; }
  nav div { display: flex; gap: 32px; }
  .hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .3em; z-index: 300000; transition: opacity .4s; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
</style>
</head>
<body>
<nav><div><span>STORY</span><span>MAP</span></div><span class="logo">Paradise</span><div><span>SHOP</span><span>CONTACT</span></div></nav>
<div class="stage" id="stage">
  <canvas id="sky"></canvas>
  <canvas id="fx"></canvas>
</div>
<div class="hint" id="hint">SCROLL · MOVE</div>

<script>
// ===== 설정 =====
const EYE = 300;        // 눈높이 (바닥이 눈보다 얼마나 아래)
const FAR = 3600;       // 초원이 끝나는 거리 (그 뒤는 모래 언덕)
const FOCUS = 1500;     // 초점 거리(무대 위치): 평면↔입체 바뀌어도 이 거리 물건 크기는 그대로
const P_FLAT = 2800, P_DEEP = 720; // 원근 강도: 클수록 평면, 작을수록 입체
const ORBIT = 0.32, STRAFE = 340;  // 좌우 호버: 초점 중심 회전(라디안) / 옆 이동
const stage = document.getElementById('stage');
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

const ART = {
  tuft: c => `<svg viewBox="0 0 40 30"><path d="M4 30 Q8 12 6 2 M12 30 Q14 10 18 4 M20 30 Q20 14 24 0 M28 30 Q30 16 36 6 M34 30 Q34 20 38 14" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  flower: c => `<svg viewBox="0 0 20 40"><path d="M10 40 V12" stroke="#4f7a2c" stroke-width="2"/><circle cx="10" cy="10" r="7" fill="${c}"/><circle cx="10" cy="10" r="2.5" fill="#f2c94c"/></svg>`,
  bush: c => `<svg viewBox="0 0 120 70"><ellipse cx="60" cy="68" rx="58" ry="5" fill="#000" opacity=".15"/><circle cx="35" cy="42" r="26" fill="${c}"/><circle cx="70" cy="32" r="30" fill="${c}"/><circle cx="95" cy="46" r="20" fill="${c}"/><rect x="10" y="44" width="100" height="24" rx="12" fill="${c}"/></svg>`,
  yellowTree: () => `<svg viewBox="0 0 200 240"><ellipse cx="100" cy="236" rx="80" ry="7" fill="#000" opacity=".15"/><path d="M100 236 V120 M100 160 L70 120 M100 150 L135 110" stroke="#6b4a2b" stroke-width="9" fill="none"/><g fill="#e8b82c"><circle cx="70" cy="95" r="45"/><circle cx="130" cy="85" r="50"/><circle cx="100" cy="55" r="48"/><circle cx="150" cy="130" r="30"/><circle cx="50" cy="135" r="30"/></g><g fill="#f4d257" opacity=".8"><circle cx="85" cy="60" r="20"/><circle cx="140" cy="80" r="18"/></g></svg>`,
  tent: c => `<svg viewBox="0 0 220 120"><ellipse cx="110" cy="117" rx="108" ry="6" fill="#000" opacity=".15"/><path d="M8 118 Q20 10 110 6 Q200 10 212 118Z" fill="${c}"/><path d="M60 118 Q70 30 110 6 Q150 30 160 118" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M90 118 Q110 60 130 118Z" fill="#5d7f8f" opacity=".7"/></svg>`,
  teepee: () => `<svg viewBox="0 0 140 190"><ellipse cx="70" cy="187" rx="66" ry="5" fill="#000" opacity=".15"/><path d="M58 0 L70 20 L82 0" stroke="#6b4a2b" stroke-width="4" fill="none"/><path d="M70 18 L4 188 H136Z" fill="#cfe7e3"/><path d="M40 95 H100 M28 125 H112 M16 157 H124" stroke="#7fb3b5" stroke-width="5"/><path d="M58 188 L70 130 L82 188Z" fill="#4d6c72"/></svg>`,
  truck: () => `<svg viewBox="0 0 260 120"><ellipse cx="130" cy="116" rx="128" ry="6" fill="#000" opacity=".18"/><path d="M10 92 V62 H120 V30 Q122 22 132 22 H180 Q190 22 196 32 L214 60 H246 Q254 62 254 72 V92Z" fill="#b8cfdc"/><path d="M140 30 H178 L198 58 H140Z" fill="#5b7686"/><rect x="10" y="58" width="112" height="8" fill="#8fa9b8"/><rect x="6" y="88" width="252" height="8" rx="3" fill="#7b8f9a"/><g fill="#2c2c2c"><circle cx="60" cy="96" r="18"/><circle cx="205" cy="96" r="18"/></g><g fill="#999"><circle cx="60" cy="96" r="7"/><circle cx="205" cy="96" r="7"/></g></svg>`,
  stage: () => `<svg viewBox="0 0 400 420"><ellipse cx="200" cy="416" rx="200" ry="10" fill="#000" opacity=".18"/>
    <rect x="10" y="340" width="380" height="76" fill="#2f8a5a"/><rect x="0" y="330" width="400" height="16" fill="#c9965a"/>
    <rect x="20" y="70" width="70" height="262" fill="#2f8a5a"/><rect x="310" y="70" width="70" height="262" fill="#2f8a5a"/>
    <path d="M20 140 Q20 20 200 16 Q380 20 380 140 H310 Q310 80 200 76 Q90 80 90 140Z" fill="#2c6f8f"/>
    <path d="M90 330 V150 Q90 80 200 78 Q310 80 310 150 V330" fill="#9fd0d8"/>
    <path d="M90 150 Q130 220 120 330 H90Z M310 150 Q270 220 280 330 H310Z" fill="#3a8ca8"/>
    <path d="M120 300 H280 V330 H120Z" fill="#b08050"/>
    <g transform="translate(200 70)"><path d="M-46 0 A46 46 0 0 1 46 0Z" fill="#f2c13c"/><g stroke="#f2c13c" stroke-width="5">${Array.from({length:9},(_,i)=>{const a=Math.PI*(i+.5)/9;return `<line x1="${-Math.cos(a)*52}" y1="${-Math.sin(a)*52}" x2="${-Math.cos(a)*68}" y2="${-Math.sin(a)*68}"/>`}).join('')}</g></g>
    <g fill="#f3a6b5">${[[40,100],[60,180],[45,260],[350,110],[335,200],[355,280],[110,40],[290,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7"/>`).join('')}</g>
    <g fill="#e08a3c"><circle cx="20" cy="66" r="8"/><circle cx="380" cy="66" r="8"/></g></svg>`,
};


// ===== 물건 배치 (x: 좌우, f: 앞으로 거리) =====
const items = [];
function place(html, x, f, w, h, opt = {}) {
  const d = document.createElement('div');
  d.className = 'obj';
  d.innerHTML = html;
  Object.assign(d.style, { width: w + 'px', height: h + 'px' });
  stage.appendChild(d);
  const it = { d, x, f, w, h, bottom: opt.bottom ?? EYE, shown: true, title: !!opt.title };
  items.push(it); return it;
}
// 하늘의 큰 제목 (무대 뒤, 올려다보면 드러남)
const title = place('<div class="title3d">Paradise</div>', 0, 2100, 3600, 1050, { title: true });

for (let i = 0; i < 380; i++) {
  const f = R(-900, 2600), x = R(-1500, 1500);
  if (Math.abs(x) < 200) continue;
  const s = R(.7, 1.4);
  place(ART.tuft(pick(['#4e7d2a', '#5f8f33', '#86b04f', '#3f6b22'])), x, f, 40 * s, 30 * s);
}
for (let i = 0; i < 160; i++) {
  const f = R(-900, 2400), x = R(-1400, 1400);
  if (Math.abs(x) < 210) continue;
  place(ART.flower(pick(['#ffffff', '#fff4c2', '#f6b6c8', '#c9e6ff'])), x, f, 18, 36);
}
for (let i = 0; i < 18; i++) {
  const side = rnd() < .5 ? -1 : 1;
  place(ART.bush(pick(['#6d8b3a', '#7f9c45', '#5c7a32'])), side * R(520, 1500), R(300, 2500), 170, 98);
}
place(ART.yellowTree(), -1050, 1750, 420, 500);
place(ART.yellowTree(), 1150, 1450, 380, 455);
place(ART.yellowTree(), -1500, 2300, 440, 525);
[[-560, 1350, '#eef4f4'], [-880, 1650, '#d9ecf0'], [600, 1500, '#f3f0ea'], [950, 1800, '#e2eef0'], [-420, 1900, '#f0ece2'], [430, 2000, '#dcecef']].forEach(([x, f, c]) => place(ART.tent(c), x, f, 320, 175));
place(ART.teepee(), 820, 1250, 200, 270);
place(ART.teepee(), -1150, 2100, 190, 255);
place(ART.truck(), -620, 950, 360, 166);
const stageObj = place(ART.stage(), 0, FOCUS, 420, 440);

// 길 양옆 장대 (전구 줄·깃발): 위로 갈수록 모이는 원근이 입체감의 핵심
const POLES = [];
for (let f = 880; f <= 1420; f += 90) { POLES.push([-250, f]); POLES.push([250, f]); }
const POLE_H = 400;
const FLAG = ['#2f9e8f', '#e08a3c', '#f3a6b5', '#f2c13c', '#5aa9c9'];

// ===== 카메라 =====
const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0;
function resize() {
  const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  for (const c of [sky, fx]) { c.width = W * r; c.height = H * r; c.getContext('2d').setTransform(r, 0, 0, r, 0, 0); }
}
resize(); addEventListener('resize', resize);

// 입력: 원페이지 — 스크롤은 페이지를 넘기지 않고 장면 진행도(p)만 바꿈
let p = 0, cp = 0, mx = 0, my = 0, cmx = 0, cmy = 0, hov = 0, chov = 0;
addEventListener('wheel', e => { e.preventDefault(); p = Math.min(1, Math.max(0, p + e.deltaY * .0011)); }, { passive: false });
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { if (ty == null) return; const y = e.touches[0].clientY; p = Math.min(1, Math.max(0, p + (ty - y) * .003)); ty = y; }, { passive: true });
addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === ' ') p = Math.min(1, p + .15); if (e.key === 'ArrowUp') p = Math.max(0, p - .15); });
addEventListener('mousemove', e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; hov = 1; });
document.addEventListener('mouseleave', () => { hov = 0; });

let C;
// 월드(x, y, f) → 화면. y는 아래가 +, 바닥 = EYE
function cam(x, y, f) {
  const dx = x - C.strafe, dz = f - FOCUS;
  const X = dx * C.cos - dz * C.sin, Z = dx * C.sin + dz * C.cos + C.P; // 초점 중심 회전, 눈은 초점에서 P 뒤
  return [X, y * C.pc + Z * C.ps, Z * C.pc - y * C.ps];                  // 올려다보기(pitch)
}
const NEAR = 30;
const projFar = (x, y, f) => proj(x, y, f, 160);
function scr(X, Y, D) { const k = C.P * C.zoom / D; return [C.cx + X * k, C.cy + Y * k, k]; }
function proj(x, y, f, near = NEAR) { const [X, Y, D] = cam(x, y, f); return D > near ? scr(X, Y, D) : null; }

// 바닥 사각형: 눈 앞(NEAR)에서 잘라 그림
function quad(ctx, x0, x1, f0, f1, color) {
  const pts = [[x0, f0], [x1, f0], [x1, f1], [x0, f1]].map(([x, f]) => cam(x, EYE, f));
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4], ia = a[2] >= NEAR, ib = b[2] >= NEAR;
    if (ia) out.push(a);
    if (ia !== ib) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
  }
  if (out.length < 3) return;
  ctx.beginPath();
  out.forEach((q, i) => { const [sx, sy] = scr(...q); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
  ctx.closePath(); ctx.fillStyle = ctx.strokeStyle = color; ctx.fill(); ctx.lineWidth = 1; ctx.stroke();
}

function drawSky() {
  const ctx = sctx, hz = C.horizon, z = C.zoom;
  const g = ctx.createLinearGradient(0, hz - H * 1.2, 0, hz);
  g.addColorStop(0, '#6fa7c4'); g.addColorStop(.6, '#b2d4e0'); g.addColorStop(1, '#e8e6d6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const ox = -C.yaw * W * .9; // 먼 배경은 조금만 움직임
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  [[.18, .55, 130, 18], [.72, .7, 170, 22], [.5, .4, 90, 12], [.95, .5, 110, 14]].forEach(([x, y, rx, ry]) => {
    ctx.beginPath(); ctx.ellipse(W * x + ox * .5, hz - H * y, rx * z, ry * z, 0, 0, 7); ctx.fill();
  });
  // 모래 언덕 두 겹
  const dune = (amp, base, col, ph, par) => {
    ctx.beginPath(); ctx.moveTo(-50, hz + 2);
    for (let x = -50; x <= W + 50; x += 20) {
      const u = (x - ox * par) / W;
      ctx.lineTo(x, hz - base * z - amp * z * (.55 + .45 * Math.sin(u * 4.2 + ph) * Math.sin(u * 1.7 + ph * 2)));
    }
    ctx.lineTo(W + 50, hz + 2); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  dune(150, 40, '#e4d2a6', .4, .6);
  dune(80, 10, '#d8c393', 2.1, 1);
  ctx.fillStyle = '#d9c69a'; ctx.fillRect(0, hz, W, H);
  // 초원 (줄무늬는 땅에 고정 → 다가가면 발밑으로 흘러옴)
  const step = 60, sand = [217, 198, 154];
  for (let f0 = Math.floor((FOCUS - C.P) / step) * step; f0 < FAR; f0 += step) {
    const fade = Math.min(1, Math.max(0, (f0 - 1900) / 1500));
    const base = (Math.round(f0 / step) & 1) ? [111, 155, 61] : [124, 170, 71];
    quad(ctx, -9000, 9000, f0, f0 + step, `rgb(${base.map((v, i) => Math.round(v + (sand[i] - v) * fade))})`);
    quad(ctx, -170, 170, f0, f0 + step, `rgb(${[230, 211, 163].map((v, i) => Math.round(v + (sand[i] - v) * fade))})`);
  }
}

// 장대·전구 줄·깃발 (진짜 3D 투영 → 올려다볼수록 위가 모임)
function drawPoles() {
  const ctx = fctx; ctx.clearRect(0, 0, W, H);
  const proj = (x, y, f) => projFar(x, y, f); // 눈에 너무 가까운 건 그리지 않음(터지듯 커지는 것 방지)
  const top = EYE - POLE_H;
  const line = (pts, color, w) => { ctx.beginPath(); let on = false; for (const q of pts) { if (!q) { on = false; continue; } on ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); on = true; } ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); };
  const sag = (a, b, s, n = 14) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n; return [a[0] + (b[0] - a[0]) * t, top + 30 + s * 4 * t * (1 - t), a[1] + (b[1] - a[1]) * t]; });
  // 먼 것부터
  const rows = [...POLES].sort((a, b) => b[1] - a[1]);
  // 길을 가로지르는 깃발 줄
  for (let f = 1420; f >= 880; f -= 180) {
    const pts = sag([-250, f], [250, f], 70, 16);
    const pr = pts.map(q => proj(...q));
    line(pr, 'rgba(70,50,30,.7)', 1);
    pts.forEach((q, i) => {
      if (i === 0 || i === pts.length - 1) return;
      const a = proj(q[0] - 9, q[1], q[2]), b = proj(q[0] + 9, q[1], q[2]), c = proj(q[0], q[1] + 26, q[2]);
      if (!a || !b || !c) return;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath();
      ctx.fillStyle = FLAG[(i + f / 180) % FLAG.length | 0]; ctx.fill();
    });
  }
  // 옆으로 이어지는 전구 줄
  for (const side of [-250, 250]) {
    const ps = POLES.filter(q => q[0] === side).sort((a, b) => b[1] - a[1]);
    for (let i = 0; i < ps.length - 1; i++) {
      const pts = sag(ps[i], ps[i + 1], 40, 10);
      line(pts.map(q => proj(...q)), 'rgba(70,50,30,.7)', 1);
      pts.forEach((q, j) => { if (j % 2) return; const s = proj(q[0], q[1] + 6, q[2]); if (!s) return; ctx.beginPath(); ctx.arc(s[0], s[1], Math.max(1, 5 * s[2]), 0, 7); ctx.fillStyle = '#fff1c4'; ctx.fill(); });
    }
  }
  for (const [x, f] of rows) {
    const a = proj(x, EYE, f), b = proj(x, top, f);
    if (!a || !b) continue;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.strokeStyle = '#5a3d24'; ctx.lineWidth = Math.max(1, 12 * a[2]); ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(b[0], b[1], Math.max(2, 20 * b[2]), 0, 7); ctx.fillStyle = 'rgba(255,230,170,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b[0], b[1], Math.max(1.5, 11 * b[2]), 0, 7); ctx.fillStyle = '#fff6dc'; ctx.fill();
  }
}

function render() {
  cp += (p - cp) * .08; cmx += (mx - cmx) * .07; cmy += (my - cmy) * .07; chov += (hov - chov) * .05;
  const e = cp * cp * (3 - 2 * cp);
  // 입체 정도: 처음엔 살짝 평면, 스크롤하거나 마우스를 가장자리로 움직일수록 입체
  const hv = Math.min(1, Math.hypot(cmx, cmy) * 1.8) * chov;
  const amt = Math.min(1, e + hv * .55 * (1 - e));
  const P = P_FLAT * Math.pow(P_DEEP / P_FLAT, amt);
  const zoom = Math.min(H / 900, W / 1440);
  // 스크롤하면 고개를 들어 하늘을 봄 (지평선이 아래로 내려감)
  // 처음엔 지평선이 화면 위쪽(정면 구도) → 스크롤하면 고개를 들어 하늘을 봄
  const pitch = Math.atan((H * .36 - H / 2) / (P * zoom)) * (1 - e) + e * .21 - cmy * .1;
  const horizon = H / 2 + Math.tan(pitch) * P * zoom;
  const yaw = -cmx * 2 * ORBIT;
  C = { P, zoom, strafe: cmx * 2 * STRAFE, cos: Math.cos(yaw), sin: Math.sin(yaw), yaw,
        pc: Math.cos(pitch), ps: Math.sin(pitch), cx: W / 2, cy: H / 2, horizon };
  drawSky();
  drawPoles();
  let stageD = 0;
  for (const it of items) {
    const [X, Y, D] = cam(it.x, it.bottom, it.f);
    let show = D > NEAR + 10;
    if (show) {
      const [sx, sy, k] = scr(X, Y, D);
      const L = sx - it.w / 2 * k, T = sy - it.h * k;
      show = L < W && L + it.w * k > 0 && T < H && sy > 0 && k < 30;
      if (show) { it.d.style.transform = `translate3d(${L}px, ${T}px, 0) scale(${k})`; it.d.style.zIndex = Math.round(100000 - D); }
      if (it === stageObj) stageD = D;
    }
    if (show !== it.shown) { it.d.style.display = show ? '' : 'none'; it.shown = show; }
  }
  title.d.style.opacity = Math.min(1, Math.max(0, (e - .15) / .55)); // 고개를 들면서 하늘 제목이 드러남
  fx.style.zIndex = Math.round(100000 - stageD) + 1; // 장대는 무대 앞, 가까운 풀 뒤
  hint.style.opacity = cp > .04 ? 0 : 1;
}
function frame() { render(); requestAnimationFrame(frame); }
frame();
</script>
</body>
</html>
